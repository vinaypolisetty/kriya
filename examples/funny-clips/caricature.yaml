# Caricature recipe: runs once per funny moment. Claude writes the joke first (who's in it, how they
# appear, the caption), you pick the funniest take, then each drawing is made from the real frame.
graph: caricature
level: moment
inherits: [comedy]

inputs:
  item: json   # one moment: id, t, what, cast (everyone in the frame), frame (a still of it)

types:
  drawing:
    fields:
      id: text                # d1, d2…
      subjects: list<text>    # the cast ids in this drawing
      image_prompt: text
  drawing_job:                # a drawing with the frame it's drawn from
    fields:
      id: text
      subjects: list<text>
      image_prompt: text
      frame: image

outputs:
  layout: joke.layout
  caption: joke.caption
  caricatures: draw.image
  subjects: draw.subjects

nodes:
  - id: joke
    kind: model
    name: Write the joke
    capability: llm.vision
    options: 3   # three different takes, which can pick different people
    prompt: |
      You are a roast comic with a cartoonist's eye. Something just went wrong in this frame:
      {{item.what}}
      Everyone here, people and animals: {{item.cast}}

      Decide who is in the joke. Often it's not just the one who fell: the friend who laughed instead
      of helping, the dog that clearly planned this, the pigeon who saw everything. Pick 1 to 4 of them,
      only the ones who make it funnier. Animals get personalities.

      Find the ONE funniest truth about this exact moment and blow it up 10x. The fall becomes a crater,
      the splash a tsunami, their dignity visibly leaving their body as a ghost. Give them a thought
      bubble, a sign or a fake title card if it's funnier. Keep what makes each of them recognizable:
      clothes, hair, the thing in their hand. {{comedy.humour}}

      premise: the joke in one line.
      layout, whichever is funnier for this moment:
        group      one scene with everyone; best when they interact (the shove, the chase)
        one_each   one caricature after another; best for a reveal (the fall... the friend laughing... the dog, smug)
        over_frame the real frame frozen, each caricature popped over where they stand; best when the real scene is already funny
      drawings: for group, one drawing with everyone; otherwise one per subject, in the order they appear.
        image_prompt: a caricature of them as they look in image 1, in this style: {{comedy.style}}.
        Each one acting out their part in the gag, every detail of it, nothing generic.
        For over_frame, a single character on a plain white background, nothing else.
      caption: at most 6 words, lands like a punchline.
    uses: [item.what, item.cast, comedy.humour, comedy.style, item.frame]
    check:
      rubric:
        - A stranger would laugh out loud.
        - Everyone picked earns their place in the joke.
        - The joke is about what happened in this clip, not a generic fall gag.
        - It punches at the situation, not at anyone's looks.
        - The caption is 6 words or fewer.
    out:
      premise: text
      layout: text
      drawings: list<drawing>
      caption: text

  - id: pick_joke
    kind: screen
    name: Pick the funniest take
    review: pick_one
    show: joke.premise
    beside: [joke.caption, joke.layout, item.frame]
    actions:
      - { id: lock, needs: [selection], locks: true }
      - { id: redo, needs: [note] }   # e.g. "meaner", "make it about the phone", "leave the friend out"

  - id: with_frame
    kind: tool
    name: Bring the frame along
    tool: attach
    uses: [joke.drawings, item.frame]
    args: { items: joke.drawings, frame: item.frame }
    out: { drawings: list<drawing_job> }

  - id: draw
    kind: map
    name: Draw each caricature
    over: with_frame.drawings
    graph: drawing

edges:
  - { from: joke, to: pick_joke }
  - { from: pick_joke, to: joke, when: "action == 'redo'", max_loops: 4 }
  - { from: pick_joke, to: with_frame, when: "action == 'lock'" }
  - { from: with_frame, to: draw }
  - { from: draw, to: END }
