# Voice recipe: runs once per voice line.
graph: voice_recipe
level: line

inputs:
  item: json

outputs:
  audio: listen.selected

nodes:
  - id: speak
    kind: model
    name: Voice the line
    capability: audio.speech
    prompt: "{{item.hinglish}}"
    uses: [item.hinglish, item.emotion, item.speaker@voice, item.speaker@speech]
    check: { seconds: { max: 8 } }   # a line over 8 s makes the Reel drag
    out:
      audio: audio
      seconds: number

  - id: too_long
    kind: model
    name: Redo faster
    capability: audio.speech
    refines: speak       # the faster take becomes the next version of the line, so 'listen' plays it
    prompt: "{{item.hinglish}}"   # a speech step's prompt is the words to say
    uses: [item.hinglish, item.emotion, item.speaker@voice]
    params: { prompt: "Speak about 20% faster than usual." }   # Gemini TTS's style field; it goes after the emotion and voice
    out:
      audio: audio
      seconds: number

  - id: listen
    kind: screen
    name: Listen and approve
    review: listen
    show: speak.audio
    beside: [item.hinglish, item.caption_en]
    batch: true
    actions:
      - { id: approve, locks: true }
      - { id: redo, needs: [note] }

edges:
  - { from: speak, to: too_long, when: "not verdict.pass" }
  - { from: speak, to: listen, when: "verdict.pass" }
  - { from: too_long, to: listen }
  - { from: listen, to: speak, when: "action == 'redo'", max_loops: 4 }
  - { from: listen, to: END, when: "action == 'approve'" }
