# Part recipe: one Instagram Reel (3 pages of a 9-page story).
graph: part_recipe
level: part
inherits: [series]   # reads the series' locked style, rules and cast
description: Turn three story pages into a finished, reviewed Reel.

inputs:
  story_pages: text
  part_no: number

types:
  shot:
    fields:
      id: text
      characters: list<library.character>   # names from the Library, exactly: a look and a voice exist for each
      place: library.place
      action: text
      lines: list<line>
      animate: boolean
      music: text        # the music cue under this shot: main, clue, villain or chase
  line:
    fields:
      id: text
      speaker: library.character
      hinglish: text
      emotion: text
      caption_en: text

outputs:
  reel: assemble.reel

nodes:
  - id: shot_list
    kind: model
    name: Break it into shots
    capability: llm.write
    prompt: |
      Turn these pages into 10 to 13 shots named P{{inputs.part_no}}-NN.
      Mark the 4 shots with the biggest motion as animate.
      Give each shot a music cue: main, clue, villain or chase.
      Use the Library's names for characters and places; put time of day, crowds and details in the action.
      Write a voice table and an end-card hook.
    uses: [inputs.story_pages, series.rules, series.cast]
    out:
      shots: list<shot>
      lines: list<line>
      hook: text

  - id: approve_shots
    kind: screen
    name: Approve the shot list
    review: approve
    show: shot_list.shots
    actions:
      - { id: approve, locks: true }
      - { id: redo, needs: [note] }

  - id: per_shot
    kind: map
    name: Make each shot
    over: shot_list.shots
    graph: shot_recipe

  - id: voices
    kind: map
    name: Voice each line
    over: shot_list.lines
    graph: voice_recipe

  - id: assemble
    kind: tool
    name: Assemble the Reel
    tool: assemble_reel
    uses: [shot_list.shots, shot_list.lines, shot_list.hook, per_shot.panel, per_shot.clip, voices.audio, series.music]
    args:
      shots: shot_list.shots
      lines: shot_list.lines
      panels: per_shot.panel
      clips: per_shot.clip     # a shot with a clip plays it; the rest pan over the panel
      voices: voices.audio
      hook: shot_list.hook     # the end card
      music: series.music      # the series' tracks, by cue; ducked under the voices
      title: MOHALLA MITRA
      max_mb: 30
      fit: pan           # fill the frame and pan, cropping a wide panel's sides; whole shows every panel entire
    out:
      reel: video
      seconds: number

  - id: watch
    kind: screen
    name: Watch the Reel
    review: approve
    show: assemble.reel
    actions:
      - { id: approve, locks: true }
      - { id: fix, needs: [note] }

edges:
  - { from: shot_list, to: approve_shots }
  - { from: approve_shots, to: shot_list, when: "action == 'redo'", max_loops: 3 }
  - { from: approve_shots, to: per_shot, when: "action == 'approve'" }
  - { from: approve_shots, to: voices, when: "action == 'approve'" }
  - { from: [per_shot, voices], to: assemble, wait: all }
  - { from: assemble, to: watch }
  - { from: watch, to: assemble, when: "action == 'fix'", max_loops: 5 }
  - { from: watch, to: END, when: "action == 'approve'" }
