name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the media tools are tested on real files: ffmpeg, and Pillow plus a font for the Reel's captions
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg python3-pil fonts-dejavu-core
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:examples
      - run: pnpm --filter @kriya/web build
